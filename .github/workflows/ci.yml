name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # Reduce matrix size - skip some combinations
          - os: ubuntu-20.04
            build_type: Debug
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          clang \
          clang-tidy \
          clang-format
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_CXX_COMPILER=$CXX
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose
    
    - name: Upload Test Results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: build/Testing/
        retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang-tidy wget gnupg
        # Install clang-format-18 from LLVM repository to match local toolchain (v18)
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | \
          sudo tee /etc/apt/sources.list.d/llvm-18.list
        sudo apt-get update
        sudo apt-get install -y clang-format-18

    - name: Check code formatting
      run: |
        # Check if any files would be reformatted (using clang-format-18 to match local toolchain)
        find src tests -name '*.cpp' -o -name '*.hpp' | \
          xargs clang-format-18 --dry-run --Werror || \
          (echo "Code formatting issues found. Run './scripts/format_code.sh' to fix." && exit 1)
    
    - name: Run static analysis
      run: |
        mkdir -p build
        cd build
        cmake ..
        # Run clang-tidy on source files
        cd ..
        ./scripts/analyze_code.sh || true
        # Note: Using '|| true' to not fail on warnings for now
        # Remove this once all warnings are addressed

  file-status-check:
    name: Per-File Status Tag Check
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine base ref
      id: base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
        else
          # First push to a new branch — nothing to diff against; empty tree.
          echo "ref=4b825dc642cb6eb9a060e54bf8d69288fbee4904" >> "$GITHUB_OUTPUT"
        fi

    - name: Check file status tags on changed files
      run: |
        # See docs/development/guides/file-status-standard.md. The whole repo passed
        # --strict as of the September 2026 rollout, so this is a real, required gate:
        # any in-scope file touched by this push/PR must carry an @adai-status tag.
        ./scripts/check_file_status.py --changed "${{ steps.base.outputs.ref }}" --strict

  todo-scanner:
    name: Scan for Untracked TODOs
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Scan for TODO comments
      run: |
        echo "🔍 Scanning for TODO comments in source files..."
        
        # Find all TODO comments in C++ source files
        TODO_COUNT=$(grep -r "TODO:" --include="*.cpp" --include="*.hpp" src/ tests/ | wc -l || true)
        
        echo "Found $TODO_COUNT TODO comments"
        
        # List all TODOs with file and line number
        if [ $TODO_COUNT -gt 0 ]; then
          echo ""
          echo "📋 TODO Comments Found:"
          echo "===================="
          grep -rn "TODO:" --include="*.cpp" --include="*.hpp" src/ tests/ || true
          echo ""
          echo "⚠️  Please ensure all TODOs are tracked in docs/development/guides/TECHNICAL_DEBT.md"
          echo "   or have associated GitHub issues."
        else
          echo "✅ No TODO comments found"
        fi
        
        # Create artifact with TODO list
        mkdir -p todo-report
        echo "# TODO Report - $(date)" > todo-report/todos.txt
        echo "" >> todo-report/todos.txt
        grep -rn "TODO:" --include="*.cpp" --include="*.hpp" src/ tests/ >> todo-report/todos.txt || echo "No TODOs found" >> todo-report/todos.txt
    
    - name: Upload TODO Report
      uses: actions/upload-artifact@v7
      with:
        name: todo-report
        path: todo-report/
        retention-days: 30

  sanitizer-tests:
    name: Sanitizer Tests
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        sanitizer: [asan, ubsan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang
    
    - name: Build with ${{ matrix.sanitizer }}
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.sanitizer }}" = "asan" ]; then
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
        else
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
        fi
        make -j$(nproc)
    
    - name: Run tests with ${{ matrix.sanitizer }}
      run: |
        cd build
        ctest --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1
        UBSAN_OPTIONS: print_stacktrace=1
