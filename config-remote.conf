# ADAI Incremental Trainer — Remote deployment config (adai@192.168.1.7)
# Run from ~/adai/ so all relative paths resolve correctly.

# Path to the vocabulary file (REQUIRED)
VOCAB_PATH=vocab.txt

# Trained model checkpoint — session 5 best snapshot
MODEL_PATH=training_sessions/session_5_best.bin

# Server port
PORT=8080

# Session timeout in minutes
SESSION_TIMEOUT=30

# Logging level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# ============================================================================
# Model Architecture Parameters
# ============================================================================

D_MODEL=128
NUM_HEADS=4
D_FF=512
NUM_ENCODER_LAYERS=6
NUM_DECODER_LAYERS=6
MAX_SEQ_LENGTH=1024

# ============================================================================
# Training Hyperparameters
# ============================================================================

LEARNING_RATE=0.00016
NUM_EPOCHS=15
WEIGHT_DECAY=0.01
GRADIENT_CLIP=0.5
BATCH_SIZE=4

# ============================================================================
# Text Generation Parameters
# ============================================================================

MAX_GEN_LENGTH=100
TEMPERATURE=0.75
TOP_P=0.9
TOP_K=50
BEAM_WIDTH=4
STRATEGY=nucleus

# ============================================================================
# Training Metrics Service
# ============================================================================

ENABLE_METRICS_SERVICE=true
METRICS_SERVER_URL=http://192.168.1.16:8081
METRICS_PUSH_TIMEOUT_MS=1000
METRICS_ENABLE_PERSISTENCE=true
METRICS_FILE=training_sessions/metrics.jsonl
METRICS_SUMMARY_FILE=training_sessions/metrics_summary.json
METRICS_PERSIST_EVERY_SAMPLES=100
METRICS_PERSIST_EVERY_SECONDS=30
METRICS_MAX_RECORDS_IN_MEMORY=10000
METRICS_MAX_RECORDS_ON_DISK=100000
METRICS_ENABLE_PROMETHEUS=false
METRICS_PROMETHEUS_FILE=training_sessions/metrics.prom
SESSION_DIR=training_sessions

# ============================================================================
# Metrics API Daemon Configuration
# ============================================================================

METRICS_API_PORT=8081
METRICS_API_ALLOW_CONTROL=true

# Session key for this trainer's slot (empty = auto-derive from session_id + host/pid)
METRICS_SESSION_KEY=

# Human-readable session label (empty = auto-derive)
METRICS_SESSION_LABEL=

# Maximum concurrent sessions retained by the registry
METRICS_MAX_LIVE_SESSIONS=16

# Seconds to retain completed session data before eviction
METRICS_COMPLETED_TTL_SECONDS=3600

# Background sweep interval for evicting stale sessions (seconds)
METRICS_SWEEP_INTERVAL_SECONDS=60

# Seconds without a metrics ingest before a live session is reported as stale.
METRICS_STALENESS_THRESHOLD_SECONDS=60

# ============================================================================
# Metrics Database Persistence (TD-020)
# ============================================================================
METRICS_STORAGE_BACKEND=sqlite+file
METRICS_DB_PATH=training_sessions/metrics.db
# METRICS_DB_URL=postgresql://user:pass@localhost:5432/adai_metrics
# METRICS_DB_POOL_SIZE=4

# ============================================================================
# Generation Quality Metrics (BLEU/ROUGE)
# ============================================================================

# Enable BLEU/ROUGE generation quality scoring during validation (default: false)
ENABLE_GENERATION_QUALITY_METRICS=false

# Number of validation pairs to score per epoch (default: 10)
GENERATION_QUALITY_SAMPLE_SIZE=10

# Max tokens per generate_response() call during scoring (default: 50)
GENERATION_QUALITY_MAX_TOKENS=50

# Minimum sample size to trigger async parallel scoring (TD-023, default: 50).
# When generation_quality_sample_size >= this value, scoring runs in a background
# thread using a model weight snapshot. Memory overhead: ~50-150 MB per epoch.
GENERATION_QUALITY_ASYNC_THRESHOLD=50

# ============================================================================
# GPU Configuration (TD-030)
# ============================================================================

# Enable GPU acceleration (default: false)
# GPU_ENABLED=true

# CUDA device index (default: 0)
# GPU_DEVICE_ID=0

# Fraction of total GPU memory ADAI may allocate (default: 0.5)
# GPU_MEMORY_FRACTION=0.9

# GPU scheduling strategy: background (low-priority, default) or full (high-priority).
# Remote training nodes typically run without a display — use 'full' for maximum throughput.
# GPU_STRATEGY=full

# ============================================================================
# Distributed Registry (TD-028 Phase 9)
# Set REGISTRY_SERVER_URL to enable multi-node distributed training pools.
# The registry_server binary (port 8082) must be running on the coordinator.
# Leave all keys commented out for standalone single-node operation.
# ============================================================================

# URL of the registry_server HTTP daemon running on the coordinator node
# REGISTRY_SERVER_URL=http://<coordinator>:8082

# Training run group name (partitions work across nodes in the same pool)
# RUN_GROUP=my-training-group

# Per-node run ID (empty = auto-derived from hostname+PID at startup)
# RUN_ID=

# HTTP request timeout for registry operations (milliseconds, default: 5000)
# REGISTRY_TIMEOUT_MS=5000
