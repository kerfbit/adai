# ADAI Chatbot Server Configuration
# Consumed by: chatbot_api_server, chatbot_gui
# Place this file at /etc/adai/config.chatbot.conf or specify with --config flag.
#
# This is one of five service-scoped config files that replace the old single
# config.conf (see CLAUDE.md "Configuration"): config.chatbot.conf,
# config.trainer.conf, config.metrics.conf, config.mns.conf, config.registry.conf.
# Discovery order: --config <path> > ./config.chatbot.conf > /etc/adai/config.chatbot.conf
# > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# ============================================================================
# Server Configuration
# ============================================================================

# Path to the vocabulary file (REQUIRED)
VOCAB_PATH=/home/rodney/Repos/adai/vocab.txt

# Path to the trained model file (optional - will use random initialization if not set)
MODEL_PATH=/home/rodney/Repos/adai/training_sessions/session_1_checkpoint.bin

# Server port
PORT=8080

# Session timeout in minutes
SESSION_TIMEOUT=30

# Logging level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# Directory for containing session data and checkpoints.
SESSION_DIR=training_sessions

# ============================================================================
# Model Architecture Parameters — FALLBACK ONLY
#
# These are used only when MNS resolution fails: NAME_SERVICE_URL/MODEL_NAME
# below are unset, the MNS daemon is unreachable, or the model isn't yet
# registered there. Once a model is registered in MNS (via `mns_cli register`),
# its stored architecture is authoritative and overrides these values at
# startup — see the "Architecture resolved from MNS" log line. Keep these in
# sync with config.trainer.conf's fallback block for standalone/no-MNS use.
# ============================================================================

D_MODEL=512
NUM_HEADS=8
D_FF=2048
NUM_ENCODER_LAYERS=6
NUM_DECODER_LAYERS=6
MAX_SEQ_LENGTH=1024

# ============================================================================
# Text Generation Parameters
# ============================================================================

# Maximum length of generated responses
MAX_GEN_LENGTH=100

# Sampling temperature (0.1-2.0)
TEMPERATURE=0.75

# Top-p (nucleus) sampling threshold (0.0-1.0)
TOP_P=0.9

# Top-k sampling parameter
TOP_K=50

# Beam width for beam search
BEAM_WIDTH=4

# Generation strategy: greedy, beam, temperature, top_k, nucleus
STRATEGY=nucleus

# ============================================================================
# RAG (Retrieval-Augmented Generation) Configuration
# ============================================================================

RAG_ENABLED=false
# RAG_DOCS_PATH=/home/rodney/Repos/adai/docs/knowledge
RAG_NUM_DOCS=3
RAG_THRESHOLD=0.0
RAG_MAX_CONTEXT_LENGTH=512

# ============================================================================
# GPU / CUDA Configuration
# ============================================================================

GPU_ENABLED=true
GPU_DEVICE_ID=0
GPU_MEMORY_FRACTION=1.0
GPU_STRATEGY=full

# ============================================================================
# Tokenizer Configuration
# ============================================================================

# TOKENIZER_MODE=ascii|unicode
TOKENIZER_MODE=ascii

# 0 = auto-size
VOCAB_BUILD_SIZE=0

# ============================================================================
# Model Name Service — client configuration
# The MNS daemon (mns_server) provides a stable model identity registry, and
# (per the block above) is the authoritative source of this model's architecture.
# ============================================================================

NAME_SERVICE_URL=http://192.168.1.16:8083
NAME_SERVICE_TIMEOUT_MS=5000

# Canonical model name registered in MNS; drives the architecture lookup above.
MODEL_NAME=ambitious-aardvark

# Role used for resolve_role() at startup; empty = use MODEL_NAME
MODEL_ROLE=chatbot
