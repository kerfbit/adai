# ADAI Chatbot Server Configuration
# Consumed by: chatbot_api_server, chatbot_gui
# Place this file at /etc/adai/config.chatbot.conf or specify with --config flag.
#
# This is one of five service-scoped config files that replace the old single
# config.conf (see CLAUDE.md "Configuration"): config.chatbot.conf,
# config.trainer.conf, config.metrics.conf, config.mns.conf, config.registry.conf.
# Discovery order: --config <path> > ./config.chatbot.conf > /etc/adai/config.chatbot.conf
# > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# ============================================================================
# Server Configuration
# ============================================================================

# Path to the vocabulary file (REQUIRED)
VOCAB_PATH=/home/rodney/Repos/adai/vocab.txt

# Path to the trained model file (optional - will use random initialization if not set)
MODEL_PATH=/home/rodney/Repos/adai/training_sessions/session_1_checkpoint.bin

# Server port
PORT=8080

# Session timeout in minutes
SESSION_TIMEOUT=30

# Logging level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# Directory for containing session data and checkpoints.
SESSION_DIR=training_sessions

# ============================================================================
# Model Architecture Parameters — FALLBACK ONLY
#
# These are used only when MNS resolution fails: NAME_SERVICE_URL/MODEL_NAME
# below are unset, the MNS daemon is unreachable, or the model isn't yet
# registered there. Once a model is registered in MNS (via `mns_cli register`),
# its stored architecture is authoritative and overrides these values at
# startup — see the "Architecture resolved from MNS" log line. Keep these in
# sync with config.trainer.conf's fallback block for standalone/no-MNS use.
# ============================================================================

D_MODEL=512
NUM_HEADS=8
D_FF=2048
NUM_ENCODER_LAYERS=6
NUM_DECODER_LAYERS=6
MAX_SEQ_LENGTH=1024

# ============================================================================
# Text Generation Parameters
# ============================================================================

# Maximum length of generated responses
MAX_GEN_LENGTH=100

# Sampling temperature (0.1-2.0)
TEMPERATURE=0.75

# Top-p (nucleus) sampling threshold (0.0-1.0)
TOP_P=0.9

# Top-k sampling parameter
TOP_K=50

# Beam width for beam search
BEAM_WIDTH=4

# Generation strategy: greedy, beam, temperature, top_k, nucleus
STRATEGY=nucleus

# ============================================================================
# RAG (Retrieval-Augmented Generation) Configuration
# ============================================================================

RAG_ENABLED=false
# RAG_DOCS_PATH=/home/rodney/Repos/adai/docs/knowledge
RAG_NUM_DOCS=3
RAG_THRESHOLD=0.0
RAG_MAX_CONTEXT_LENGTH=512

# ============================================================================
# GPU / CUDA Configuration
# ============================================================================

GPU_ENABLED=true
GPU_DEVICE_ID=0
GPU_MEMORY_FRACTION=1.0
GPU_STRATEGY=full

# ============================================================================
# Tokenizer Configuration
# ============================================================================

# TOKENIZER_MODE=ascii|unicode
TOKENIZER_MODE=ascii

# 0 = auto-size
VOCAB_BUILD_SIZE=0

# ============================================================================
# Model Name Service — client configuration
# The MNS daemon (mns_server) provides a stable model identity registry, and
# (per the block above) is the authoritative source of this model's architecture.
# ============================================================================

NAME_SERVICE_URL=http://192.168.1.16:8083
NAME_SERVICE_TIMEOUT_MS=5000

# Canonical model name registered in MNS; drives the architecture lookup above.
MODEL_NAME=ambitious-aardvark

# Role used for resolve_role() at startup; empty = use MODEL_NAME
MODEL_ROLE=chatbot

# ============================================================================
# Hippocampal memory (TD-185; TD-193 wires attachment + persistence into chatbot_api_server
# itself) — episodic buffer for the LeJEPA world-model plan
# (docs/proposals/lejepa_world_model_gated_injection_plan.md's Component 5/6).
# Keys are written to the buffer via EncoderDecoderModel::maybe_write_hippocampal_memory(),
# using the attached world model as the key source — enabling this without also attaching a
# world model (WORLD_MODEL_ENABLED=true, a checkpoint present at SESSION_DIR/world_model, and
# WORLD_MODEL_INJECT_EVERY_N_LAYERS matching what that checkpoint's own served model was trained
# with) has no effect. The world model itself is configured/pretrained separately via
# `incremental_trainer --objective=lejepa` and this same WORLD_MODEL_* block (TD-183) — an
# operator running both incremental_trainer and chatbot_api_server for the same model needs
# SESSION_DIR set consistently across config.trainer.conf/config.chatbot.conf (or left at its
# shared default) for the two binaries to agree on where the world model checkpoint lives.
# When enabled, chatbot_api_server persists the live ring buffer to `MODEL_PATH.hippocampal`
# (loaded back on the next startup — TD-193's whole point: remaining persistent from conversation
# to conversation instead of resetting empty every restart) and evicted-but-recoverable slots to
# `MODEL_PATH.hippocampal.swap` (see HippocampalMemory's own class doc for the swap/recall design).
# Both experimental — see TD-186's own pilot findings before enabling in production.
# ============================================================================

# Master switch — false (default) disables the feature entirely, same guarantee every
# other LeJEPA-batch gated path in this codebase makes.
HIPPOCAMPAL_MEMORY_ENABLED=false

# Ring-buffer bound — the least-used slot (lowest attention coverage, not simply the oldest) is
# evicted on overflow, into the swap file described above (TD-193).
HIPPOCAMPAL_MEMORY_CAPACITY=512

# Attention-level repetition penalty growth rate (DecoderBlock's own gated hippocampal
# cross-attention, TD-180) — 0.0 (default) makes the penalty an explicit opt-in
# magnitude, not just on/off, so a pilot can sweep it rather than committing up front.
HIPPOCAMPAL_REPETITION_ALPHA=0.0

# Per-decode-step coverage decay, 0 < gamma <= 1. 1.0 disables decay (pure running sum);
# lower values make the penalty track recent repetition more than distant repetition.
HIPPOCAMPAL_REPETITION_DECAY=0.95

# Optional auxiliary training-time coverage loss (See et al.'s own coverage loss) —
# 0.0 (default) = off for the initial pilot.
HIPPOCAMPAL_COVERAGE_LOSS_WEIGHT=0.0
