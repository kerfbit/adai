# ADAI Chatbot Server Configuration
# Production-ready configuration file
# Place this file at /etc/adai/config.conf or specify with --config flag

# ============================================================================
# Server Configuration
# ============================================================================

# Path to the vocabulary file (REQUIRED)
VOCAB_PATH=/home/rodney/Repos/adai/vocab.txt

# Path to the trained model file (optional - will use random initialization if not set)
# Uncomment and set path when you have a trained model
# MODEL_PATH=/home/rodney/Repos/adai/models/model.bin

# Server port
PORT=8080

# Session timeout in minutes
SESSION_TIMEOUT=30

# Logging level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# ============================================================================
# Model Architecture Parameters
# These should match the architecture used during training
# ============================================================================

# Model dimension
D_MODEL=768

# Number of attention heads
NUM_HEADS=8

# Feed-forward network dimension
D_FF=4096

# Number of encoder layers
NUM_ENCODER_LAYERS=12

# Number of decoder layers
NUM_DECODER_LAYERS=12

# Maximum sequence length
MAX_SEQ_LENGTH=1024

# ============================================================================
# Training Hyperparameters
# Used by incremental_trainer; ignored by the inference server
# ============================================================================

# Initial learning rate
LEARNING_RATE=0.0001

# Number of training epochs per session
NUM_EPOCHS=10

# L2 weight decay regularization
WEIGHT_DECAY=0.01

# Gradient clipping norm (0 = disabled)
GRADIENT_CLIP=1.0

# Samples per gradient update
BATCH_SIZE=1

# ============================================================================
# Text Generation Parameters
# ============================================================================

# Maximum length of generated responses
MAX_GEN_LENGTH=100

# Sampling temperature (0.1-2.0)
# Lower = more deterministic, Higher = more creative
TEMPERATURE=0.75

# Top-p (nucleus) sampling threshold (0.0-1.0)
TOP_P=0.9

# Top-k sampling parameter
TOP_K=50

# Beam width for beam search
BEAM_WIDTH=4

# Generation strategy: greedy, beam, temperature, top_k, nucleus
STRATEGY=nucleus
