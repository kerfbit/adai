# ADAI Chatbot Server Configuration
# Production-ready configuration file
# Place this file at /etc/adai/config.conf or specify with --config flag

# ============================================================================
# Server Configuration
# ============================================================================

# Path to the vocabulary file (REQUIRED)
VOCAB_PATH=/home/rodney/Repos/adai/vocab.txt

# Path to the trained model file (optional - will use random initialization if not set)
# Uncomment and set path when you have a trained model
MODEL_PATH=/home/rodney/Repos/adai/training_sessions/session_0_checkpoint.bin

# Server port
PORT=8080

# Session timeout in minutes
SESSION_TIMEOUT=30

# Logging level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# ============================================================================
# Model Architecture Parameters
# These should match the architecture used during training
# ============================================================================

# Model dimension
D_MODEL=128

# Number of attention heads
NUM_HEADS=4

# Feed-forward network dimension
D_FF=512

# Number of encoder layers
NUM_ENCODER_LAYERS=6

# Number of decoder layers
NUM_DECODER_LAYERS=6

# Maximum sequence length
MAX_SEQ_LENGTH=1024

# ============================================================================
# Training Hyperparameters
# Used by incremental_trainer; ignored by the inference server
# ============================================================================

# Initial learning rate
LEARNING_RATE=0.00008

# Number of training epochs per session
NUM_EPOCHS=15

# L2 weight decay regularization
WEIGHT_DECAY=0.01

# Gradient clipping norm (0 = disabled)
GRADIENT_CLIP=1.0

# Samples per gradient update
BATCH_SIZE=4

# ============================================================================
# Text Generation Parameters
# ============================================================================

# Maximum length of generated responses
MAX_GEN_LENGTH=100

# Sampling temperature (0.1-2.0)
# Lower = more deterministic, Higher = more creative
TEMPERATURE=0.75

# Top-p (nucleus) sampling threshold (0.0-1.0)
TOP_P=0.9

# Top-k sampling parameter
TOP_K=50

# Beam width for beam search
BEAM_WIDTH=4

# Generation strategy: greedy, beam, temperature, top_k, nucleus
STRATEGY=nucleus

# ============================================================================
# Training Metrics Service Configuration
# Real-time training metrics collection and monitoring
# ============================================================================

# Enable training metrics service
# Set to true to collect and track training metrics
ENABLE_METRICS_SERVICE=true

# Push metrics to external metrics API daemon
# The daemon (metrics-api-server) should be running as a systemd service
METRICS_PUSH_ENABLED=true

# URL of the metrics API daemon
# Start the daemon with: systemctl start metrics-api-server
METRICS_SERVER_URL=http://localhost:8081

# HTTP request timeout for pushing metrics (milliseconds)
METRICS_PUSH_TIMEOUT_MS=1000

# Enable persistence of metrics to disk
METRICS_ENABLE_PERSISTENCE=true

# Path to metrics JSON Lines file
METRICS_FILE=training_sessions/metrics.jsonl

# Path to metrics summary JSON file
METRICS_SUMMARY_FILE=training_sessions/metrics_summary.json

# Persist metrics every N samples (reduces I/O overhead)
METRICS_PERSIST_EVERY_SAMPLES=100

# Persist metrics every N seconds (ensures periodic updates)
METRICS_PERSIST_EVERY_SECONDS=30

# Maximum records to keep in memory before trimming
METRICS_MAX_RECORDS_IN_MEMORY=10000

# Maximum records to keep on disk before rotation
METRICS_MAX_RECORDS_ON_DISK=100000

# Enable Prometheus format export
METRICS_ENABLE_PROMETHEUS=false

# Path to Prometheus metrics file
METRICS_PROMETHEUS_FILE=training_sessions/metrics.prom

# ============================================================================
# Metrics API Daemon Configuration
# Used when running metrics-api-server as a standalone daemon
# ============================================================================

# Port for metrics API server daemon
# Access via: http://localhost:8081/api/session/status
METRICS_API_PORT=8081

# Allow control endpoints (flush, clear)
# Set to false for read-only access
METRICS_API_ALLOW_CONTROL=true

# ============================================================================
# Generation Quality Metrics Configuration
# Compute BLEU/ROUGE scores during each validation pass.
# Opt-in because it calls generate_response() on a sample of the validation
# set, which is significantly more expensive than loss-only validation.
# ============================================================================

# Enable BLEU/ROUGE generation quality scoring (default: false)
ENABLE_GENERATION_QUALITY_METRICS=true

# Number of validation pairs to sample and score per epoch (default: 10)
GENERATION_QUALITY_SAMPLE_SIZE=10

# Max tokens per generate_response() call during scoring (default: 50)
GENERATION_QUALITY_MAX_TOKENS=50

# ============================================================================
# RAG (Retrieval-Augmented Generation) Configuration
# Enables factual grounding by retrieving relevant documents before generation
# ============================================================================

# Enable RAG for all inference paths (default: false)
# When enabled, all /chat and /chat/session requests are routed through the
# RAG engine, which retrieves relevant documents before generating a response.
RAG_ENABLED=false

# Path to directory containing .txt documents to index
# Each .txt file in this directory is loaded as a separate document at startup.
# Leave empty or comment out to disable document loading.
# RAG_DOCS_PATH=/home/rodney/Repos/adai/docs/knowledge

# Number of documents to retrieve per query (default: 3)
RAG_NUM_DOCS=3

# Minimum cosine similarity score required for a document to be included
# in the context. Set to 0.0 to include all retrieved documents regardless
# of similarity. Valid range: 0.0 - 1.0 (default: 0.0)
RAG_THRESHOLD=0.0

# Maximum number of tokens to include from retrieved context (default: 512)
RAG_MAX_CONTEXT_LENGTH=512
