# ADAI Metrics API Daemon Configuration
# Consumed by: metrics_api_server
# Place this file at /etc/adai/config.metrics.conf or specify with --config flag.
# CLI flags (see `metrics_api_server --help`) override any value loaded here.
#
# One of five service-scoped config files (see CLAUDE.md "Configuration"):
# config.chatbot.conf, config.trainer.conf, config.metrics.conf, config.mns.conf,
# config.registry.conf. Discovery order: --config <path> > ./config.metrics.conf
# > /etc/adai/config.metrics.conf > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# Port for metrics API server daemon
# Access via: http://localhost:8081/api/session/status
METRICS_API_PORT=8081

# Allow control endpoints (flush, clear, admin/config). Set to false for
# read-only access.
METRICS_API_ALLOW_CONTROL=true

# Browser origins allowed to use this API from a web page on another origin (TD-526),
# comma-separated, e.g. https://dashboard.example:8443. Listed origins may read responses
# and send writes; "*" lets any page read (never write). Empty = no cross-origin access.
# Clients that aren't browsers (the trainer, the Android app, curl) send no Origin and
# aren't affected. A browser-based dashboard (e.g. the Tizen app, if its runtime enforces
# CORS) needs its origin listed here.
METRICS_API_CORS_ALLOWED_ORIGINS=

# Enable persistence of metrics to disk
METRICS_ENABLE_PERSISTENCE=true

# Path to metrics JSON Lines file
METRICS_FILE=training_sessions/metrics.jsonl

# Path to metrics summary JSON file
METRICS_SUMMARY_FILE=training_sessions/metrics_summary.json

# Persist metrics every N samples / N seconds (reduces I/O overhead)
METRICS_PERSIST_EVERY_SAMPLES=100
METRICS_PERSIST_EVERY_SECONDS=30

# Maximum records kept in memory per session
METRICS_MAX_RECORDS_IN_MEMORY=10000
# Maximum DB rows (history, and per-step gradient variance) kept per session; when exceeded,
# the oldest rows are thinned to 3/4 of this, so old history gets sparser (0 = no cap)
METRICS_MAX_RECORDS_ON_DISK=100000

# Delete sessions (DB rows and archived files) not updated for this many days (0 = keep forever)
METRICS_RETENTION_DAYS=90

# Rotate each session's JSONL metrics file at this size, keeping this many old files
METRICS_FILE_MAX_MB=100
METRICS_FILE_BACKUPS=3

# Enable Prometheus format export
METRICS_ENABLE_PROMETHEUS=false
METRICS_PROMETHEUS_FILE=training_sessions/metrics.prom

# Maximum live sessions retained by metrics session registry.
METRICS_MAX_LIVE_SESSIONS=16

# Retention window for completed sessions before eviction.
METRICS_COMPLETED_TTL_SECONDS=3600

# Background sweep interval for evicting stale completed sessions.
METRICS_SWEEP_INTERVAL_SECONDS=60

# Seconds without a metrics ingest before a live session is reported as stale.
METRICS_STALENESS_THRESHOLD_SECONDS=60

# ============================================================================
# Metrics Database Persistence (TD-020)
# ============================================================================

# Storage backend: "file", "sqlite", "postgres", "sqlite+file", "postgres+file"
METRICS_STORAGE_BACKEND=sqlite+file

# SQLite database file path
METRICS_DB_PATH=training_sessions/metrics.db

# PostgreSQL connection URL (used when backend includes "postgres")
# METRICS_DB_URL=postgresql://user:pass@localhost:5432/adai_metrics

# PostgreSQL connection pool size
# METRICS_DB_POOL_SIZE=4

# ============================================================================
# Optional MNS proxy link — lets the dashboard cross-reference sessions
# against Model Name Service records. Empty = disabled.
# ============================================================================

NAME_SERVICE_URL=http://192.168.1.16:8083
