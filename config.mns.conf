# ADAI Model Name Service Daemon Configuration
# Consumed by: mns_server
# Place this file at /etc/adai/config.mns.conf or specify with --config flag.
# CLI flags (see `mns_server --help`) override any value loaded here.
#
# One of five service-scoped config files (see CLAUDE.md "Configuration"):
# config.chatbot.conf, config.trainer.conf, config.metrics.conf, config.mns.conf,
# config.registry.conf. Discovery order: --config <path> > ./config.mns.conf
# > /etc/adai/config.mns.conf > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# Listen port for the mns_server daemon
NAME_SERVICE_PORT=8083

# Storage directory for MNS SQLite data (models.db, daemon_config.db)
NAME_SERVICE_DIR=name_service

# ----------------------------------------------------------------------------
# Registry proxy — lets GET /models/{name}/datasets forward to a registry_server
# for training-history lookups. Reuses REGISTRY_SERVER_URL/RUN_GROUP (the same
# keys used elsewhere as a *client's* target registry) as mns_server's own
# proxy target; leave REGISTRY_SERVER_URL empty to disable the proxy endpoint.
# Live-mutable via PUT /admin/config (see ModelNameService::set_registry).
# ----------------------------------------------------------------------------

REGISTRY_SERVER_URL=http://192.168.1.16:8082
RUN_GROUP=my-training-group

# ----------------------------------------------------------------------------
# Architecture defaults for `mns_cli register` — only used as the template
# when registering a brand-new model without explicit --d-model/--num-heads/
# etc. flags. Not read by mns_server itself; once a model is registered its
# stored architecture (see config.chatbot.conf / config.trainer.conf) is
# authoritative and these values have no further effect on it.
# ----------------------------------------------------------------------------

D_MODEL=512
NUM_HEADS=8
D_FF=2048
NUM_ENCODER_LAYERS=6
NUM_DECODER_LAYERS=6
MAX_SEQ_LENGTH=1024
