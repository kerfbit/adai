# ADAI Distributed Dataset Registry Configuration
# Consumed by: registry_server (daemon), dataset_manager (client CLI)
# Place this file at /etc/adai/config.registry.conf or specify with --config flag.
# For registry_server, CLI flags (see `registry_server --help`) override any
# value loaded here.
#
# One of five service-scoped config files (see CLAUDE.md "Configuration"):
# config.chatbot.conf, config.trainer.conf, config.metrics.conf, config.mns.conf,
# config.registry.conf. Discovery order: --config <path> > ./config.registry.conf
# > /etc/adai/config.registry.conf > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# ============================================================================
# registry_server daemon settings
# ============================================================================

# Listen port for the registry_server daemon itself.
REGISTRY_LISTEN_PORT=8082

# Root directory for per-group state (data_registry.txt, pending_files.txt,
# fetch_cursors/, datasets/, uploads/, daemon_config.db).
REGISTRY_DATA_DIR=registry_sessions

# Claim lease (TD-494): a trainer's claim on a pending file lasts this many minutes unless the
# trainer renews it (trainers renew automatically every third of the lease while they train). A
# crashed trainer's files return to the pool once the lease runs out. 0 = claims never expire.
REGISTRY_CLAIM_LEASE_MINUTES=30

# Largest request body accepted, in MiB (uploads); larger ones get 413. Large datasets are better
# fetched server-side or copied onto the registry host.
REGISTRY_MAX_UPLOAD_MB=2048

# Gutenberg/HuggingFace fetches that may run at once; more get 429 (retry later). Keeps the
# request threads free for trainers' acquire/trained calls.
REGISTRY_MAX_CONCURRENT_FETCHES=2

# ----------------------------------------------------------------------------
# Embedded FTP data server (Phase 10). Every key below is read by registry_server; a CLI flag
# (--ftp-enabled, --ftp-ip, --ftp-port, --ftp-pasv-min/--ftp-pasv-max, --ftp-secret, --ftps,
# --ftp-cert/--ftp-key) overrides it, with a startup warning when the two differ (TD-284).
# ----------------------------------------------------------------------------

# Start the FTP listener (or --ftp-enabled)
FTP_SERVER_ENABLED=false
# Address trainers are told to connect to (or --ftp-ip)
# FTP_ADVERTISE_IP=
FTP_SERVER_PORT=2121
FTP_PASV_PORT_MIN=50000
FTP_PASV_PORT_MAX=50099

# Per-file FTP token TTL in minutes. Live-mutable via PUT /admin/config.
FTP_TOKEN_TTL_MINUTES=30

# HMAC key for FTP token passwords; unset = a random password per token. Set a long random value
# if you want one (e.g. openssl rand -hex 32). The old placeholder 'change-me-in-production' is
# ignored with a warning, since a publicly known key would let anyone compute token passwords.
# FTP_DATA_SERVER_SECRET=

# Max concurrent FTP sessions per run_id; 0 = unlimited. Live-mutable via
# PUT /admin/config.
FTP_MAX_SESSIONS_PER_RUN=4

# Enable FTPS (FTP over TLS). registry_server warns at startup when FTP is enabled without it on a
# non-loopback FTP_ADVERTISE_IP.
FTPS_ENABLED=false
# FTP_CERT_FILE=
# FTP_KEY_FILE=

# ============================================================================
# registry client settings — used by dataset_manager and other registry
# clients when pointed at this file. incremental_trainer keeps its own copy
# of these keys in config.trainer.conf.
# ============================================================================

REGISTRY_SERVER_URL=http://192.168.1.16:8082
RUN_GROUP=chatbot-v1
RUN_ID=run-01
REGISTRY_TIMEOUT_MS=5000
# DOWNLOAD_DIR=
MAX_PARALLEL_DOWNLOADS=4
LARGE_FILE_WARN_THRESHOLD_MB=500
