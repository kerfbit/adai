# ADAI Incremental Trainer Configuration
# Consumed by: incremental_trainer
# Place this file at /etc/adai/config.trainer.conf or specify with --config flag.
#
# One of five service-scoped config files (see CLAUDE.md "Configuration"):
# config.chatbot.conf, config.trainer.conf, config.metrics.conf, config.mns.conf,
# config.registry.conf. Discovery order: --config <path> > ./config.trainer.conf
# > /etc/adai/config.trainer.conf > ./config.conf (legacy) > /etc/adai/config.conf (legacy).

# ============================================================================
# Model Architecture Parameters — FALLBACK ONLY
#
# Used only when MNS resolution fails: NAME_SERVICE_URL/MODEL_NAME below are
# unset, the MNS daemon is unreachable, or the model isn't yet registered
# there. Once a model is registered in MNS (via `mns_cli register`), its
# stored architecture is authoritative and overrides these values at startup
# — see the "Architecture resolved from MNS" log line. Keep these in sync
# with config.chatbot.conf's fallback block; they must match the checkpoint.
# ============================================================================

D_MODEL=768
NUM_HEADS=12
D_FF=3072
NUM_ENCODER_LAYERS=8
NUM_DECODER_LAYERS=24
MAX_SEQ_LENGTH=512

# ============================================================================
# Training Hyperparameters
# ============================================================================

LEARNING_RATE=0.00016
NUM_EPOCHS=20
WEIGHT_DECAY=0.01

# Gradient clipping norm (0 = disabled)
GRADIENT_CLIP=0.5

# Adaptive gradient clipping (TD-017)
GRADIENT_CLIP_ADAPTIVE=false
GRADIENT_CLIP_MIN=0.1
GRADIENT_CLIP_MAX=5.0
GRADIENT_CLIP_EMA_DECAY=0.05
GRADIENT_CLIP_HEADROOM=2.0
GRADIENT_CLIP_WARMUP_STEPS=100
GRADIENT_CLIP_SPIKE_K=5.0

# Samples per gradient update
BATCH_SIZE=4

# Number of samples to accumulate gradients over before each optimizer step.
GRADIENT_ACCUMULATION_STEPS=32

# ============================================================================
# Logging / Session
# ============================================================================

LOG_LEVEL=INFO
# LOG_FILE_PATH=
LOG_MAX_SIZE_MB=10
LOG_MAX_FILES=5
LOG_COMPRESS=false

# Directory for containing session data and checkpoints.
SESSION_DIR=training_sessions

# ============================================================================
# Generation Quality Metrics Configuration
# BLEU/ROUGE scoring during validation — opt-in, calls generate_response()
# on a sample of the validation set.
# ============================================================================

ENABLE_GENERATION_QUALITY_METRICS=true
GENERATION_QUALITY_SAMPLE_SIZE=40
GENERATION_QUALITY_MAX_TOKENS=50
GENERATION_QUALITY_ASYNC_THRESHOLD=50

# ============================================================================
# GPU / CUDA Configuration
# ============================================================================

GPU_ENABLED=true
GPU_DEVICE_ID=0
GPU_MEMORY_FRACTION=1.0
GPU_STRATEGY=full

# ============================================================================
# Tokenizer Configuration
# ============================================================================

TOKENIZER_MODE=ascii
VOCAB_BUILD_SIZE=0

# ============================================================================
# Training Metrics — client configuration
# Pushes metrics to the metrics_api_server daemon (see config.metrics.conf
# for that daemon's own settings).
# ============================================================================

ENABLE_METRICS_SERVICE=true

# URL of the metrics API daemon; leave empty to disable push reporting entirely
METRICS_SERVER_URL=http://192.168.1.16:8081

# HTTP request timeout for pushing metrics (milliseconds)
METRICS_PUSH_TIMEOUT_MS=1000

# Idle heartbeat period sent by MetricsPushClient (milliseconds)
METRICS_HEARTBEAT_INTERVAL_MS=30000

# Human-readable label for this session; empty = auto-derive
METRICS_SESSION_LABEL=

# ============================================================================
# Model Name Service — client configuration
# ============================================================================

NAME_SERVICE_URL=http://192.168.1.16:8083
NAME_SERVICE_TIMEOUT_MS=5000

# Canonical model name registered in MNS; drives the architecture lookup above.
MODEL_NAME=chatbot-v1

# Role used for resolve_role() at startup; empty = use MODEL_NAME
MODEL_ROLE=chatbot

# ============================================================================
# Distributed Dataset Registry — client configuration
# Points at the registry_server daemon (see config.registry.conf for that
# daemon's own settings). Leave REGISTRY_SERVER_URL empty for standalone
# single-node operation.
# ============================================================================

REGISTRY_SERVER_URL=http://192.168.1.16:8082

# Training run group name (partitions work across nodes in the same pool)
RUN_GROUP=chatbot-v1

# Per-node run ID (empty = auto-derived from hostname+PID at startup)
RUN_ID=run-01

# HTTP request timeout for registry operations (milliseconds)
REGISTRY_TIMEOUT_MS=5000

# Trainer-owned directory for FTP downloads; empty = FTP transport disabled
# DOWNLOAD_DIR=

# Maximum concurrent FTP connections in fetch_all()
MAX_PARALLEL_DOWNLOADS=4

# Log a warning when a file transfer exceeds this size in MB; 0 = disabled
LARGE_FILE_WARN_THRESHOLD_MB=500

# ============================================================================
# Tokenized-data cache
# ChatbotTrainer::preprocess_data() (BPE tokenization) can take a very long
# time on large datasets (hours, on the full production corpus) — enabling
# this persists the result to disk so a subsequent train/retrain/resume
# against the same dataset+vocab+tokenizer config skips straight back to
# training instead of repeating it. Recommended wherever `resume` runs under
# process supervision (see scripts/adai-trainer.service) so a crash-restart
# doesn't cost hours of re-tokenization.
# ============================================================================

CACHE_TOKENIZED_DATA=true

# Directory for the cache, relative to the trainer's working directory unless
# given as an absolute path.
TOKENIZED_CACHE_DIR=tokenized_cache

# ============================================================================
# Auto-save / checkpoint retention
# ============================================================================

# Enable periodic auto-save checkpoints during a training pass
AUTO_SAVE_ENABLED=true

# Auto-save every N samples; 0 = disabled by sample count
AUTO_SAVE_EVERY_SAMPLES=1000

# Auto-save every N minutes; 0 = disabled by wall-clock interval
AUTO_SAVE_EVERY_MINUTES=30

# Maximum number of session checkpoints to retain; older ones are pruned. 0 = unlimited
MAX_SESSIONS_TO_KEEP=50

# ============================================================================
# Trainer admin API — used by trainer_service (TD-172), the always-on process
# supervisor that launches `incremental_trainer` as a single-pass child per
# training pass. Exposes GET/PUT /admin/config, /admin/status,
# /admin/checkpoint, /admin/pause, /admin/resume, proxying through to
# whichever child is currently alive. See CLAUDE.md "Incremental trainer
# admin API".
# ============================================================================

# Opt-in — false leaves trainer_service running with no public admin port at all.
TRAINER_ADMIN_ENABLED=false

# Next free port slot after chatbot=8080/metrics=8081/registry=8082/mns=8083.
# This is trainer_service's own public-facing listener, not any one child's.
TRAINER_ADMIN_PORT=8084

# Loopback-only by default — /admin/* carries no auth token.
TRAINER_ADMIN_HOST=127.0.0.1

# daemon_config.db overlay directory for admin-mutable settings; deliberately
# its own subdirectory, not session_dir directly.
TRAINER_ADMIN_DIR=trainer_admin

# Loopback-only port trainer_service assigns to each single-pass child it
# launches (`incremental_trainer --admin-port <N> resume`) — distinct from
# TRAINER_ADMIN_PORT above. Only one child runs at a time, so a single fixed
# port needs no runtime discovery.
TRAINER_CHILD_ADMIN_PORT=8085

# ============================================================================
# World-model (LeJEPA) pretraining + injection (TD-183 filed pretraining; TD-186 wires
# injection) — see docs/proposals/lejepa_world_model_gated_injection_plan.md's Phase 0/1.
# WORLD_MODEL_ENABLED is one master switch covering BOTH: `--objective=lejepa train` (Phase 0
# pretraining) AND the plain chatbot objective's own IncrementalTrainer::build_model(), which
# attaches a pretrained world model to the chatbot's EncoderDecoderModel when this is true AND
# WORLD_MODEL_INJECT_EVERY_N_LAYERS >= 1 (both required — see that key's own comment below).
# The D_MODEL/NUM_HEADS/etc. fallback block above sizes the *chatbot* model; the world model is
# deliberately its own, separately-sized architecture (own MNS ModelRecord too, per TD-184) with
# one hard exception: WORLD_MODEL_D_MODEL must equal D_MODEL whenever injection is enabled — the
# gated cross-attention is built with the chatbot's own d_model on both sides (CrossAttention has
# no separate kv-dimension parameter).
# ============================================================================

# Master switch — false (default) disables both the pretraining objective and chatbot-side
# attachment entirely; `--objective=lejepa` refuses to start with a clear error rather than
# silently training an unconfigured architecture.
WORLD_MODEL_ENABLED=true

# World-model embedding dimension. Must equal D_MODEL above once WORLD_MODEL_INJECT_EVERY_N_LAYERS
# >= 1 (see this block's own note).
WORLD_MODEL_D_MODEL=768

# Number of world-model encoder layers.
WORLD_MODEL_NUM_LAYERS=16

# Number of world-model attention heads.
WORLD_MODEL_NUM_HEADS=12

# World-model feed-forward dimension (also reused as the Predictor's hidden_dim).
WORLD_MODEL_D_FF=3072

# Lambda weighting SIGReg's gradient contribution against the predictor's own in
# LeJEPAEncoder::train_step().
WORLD_MODEL_SIGREG_LAMBDA=1.0

# Number of random sketch projections SIGReg uses.
WORLD_MODEL_SIGREG_NUM_SKETCHES=64

# Sparsity of gated world-model cross-attention injection into the chatbot's own decoder; 0
# (default) = never inject, even with WORLD_MODEL_ENABLED=true (a separate, deliberate opt-in
# from just enabling pretraining) — N >= 1 attaches a pretrained world model (from
# <session_dir>/world_model) to the chatbot's own model at build time and gates every Nth
# decoder layer (1 = every layer). Read by IncrementalTrainer::build_model() (TD-186); NOT read
# by `--objective=lejepa` itself, which only trains the standalone encoder.
WORLD_MODEL_INJECT_EVERY_N_LAYERS=0

# ============================================================================
# Hippocampal memory (TD-185 filed these keys; TD-186 wires the ones below into
# ServiceConfig/build_model()) — episodic buffer for the LeJEPA world-model plan
# (docs/proposals/lejepa_world_model_gated_injection_plan.md's Component 5/6). The write side
# (EncoderDecoderModel::maybe_write_hippocampal_memory()) and read side (DecoderBlock's own
# gated hippocampal cross-attention, threaded through by IncrementalTrainer::build_model()) both
# use the attached world model (see the WORLD_MODEL_* block above) as the key source — enabling
# this without also attaching a world model (WORLD_MODEL_ENABLED=true AND
# WORLD_MODEL_INJECT_EVERY_N_LAYERS >= 1) has no effect.
# ============================================================================

# Master switch — false (default) disables the feature entirely, same guarantee every
# other LeJEPA-batch gated path in this codebase makes.
HIPPOCAMPAL_MEMORY_ENABLED=false

# Ring-buffer bound — the least-used slot (lowest attention coverage, not simply the oldest) is
# evicted on overflow (TD-193; see HippocampalMemory's own class doc for the swap/recall design
# chatbot_api_server's own persistence uses — this trainer binary doesn't configure a swap file).
HIPPOCAMPAL_MEMORY_CAPACITY=512

# Attention-level repetition penalty growth rate (DecoderBlock's own gated hippocampal
# cross-attention, TD-180) — 0.0 (default) makes the penalty an explicit opt-in
# magnitude, not just on/off, so a pilot can sweep it rather than committing up front.
HIPPOCAMPAL_REPETITION_ALPHA=0.0

# Per-decode-step coverage decay, 0 < gamma <= 1. 1.0 disables decay (pure running sum);
# lower values make the penalty track recent repetition more than distant repetition.
HIPPOCAMPAL_REPETITION_DECAY=0.95

# TD-194: gated cross-reference pull strength — see config.chatbot.conf's own copy of this key
# for the full design rationale (DecoderBlock's association_matrix()/tanh-bounded boost). 0.0
# (default) is an explicit opt-in magnitude, same convention HIPPOCAMPAL_REPETITION_ALPHA follows.
HIPPOCAMPAL_CROSS_REFERENCE_ALPHA=0.0

# Per-decode-step association decay, 0 < gamma <= 1, mirroring HIPPOCAMPAL_REPETITION_DECAY's
# own role for coverage. 1.0 disables decay.
HIPPOCAMPAL_ASSOCIATION_DECAY=0.95

# Optional auxiliary training-time coverage loss (See et al.'s own coverage loss) — 0.0
# (default) = off. Still not read by any config loader as of TD-186 — no training loop in this
# codebase computes an auxiliary loss term from HippocampalMemory's coverage vector yet, so
# there is nothing for this key to feed into. Left filed for whenever that lands.
HIPPOCAMPAL_COVERAGE_LOSS_WEIGHT=0.0
