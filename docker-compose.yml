# Docker Compose configuration for ADAI Chatbot API
#
# TODO: See TECHNICAL_DEBT.md Future Enhancement #12 - Multi-architecture builds
#
version: '3.8'

services:
  # Metrics API daemon — captures and exposes training metrics
  # Addresses TECHNICAL_DEBT.md Future Enhancement #17 - Multi-container orchestration (metrics, logging)
  metrics-api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: adai-chatbot:latest
    container_name: adai-metrics-api
    command: ./metrics_api_server
    ports:
      - "8081:8081"
    volumes:
      - ./training_sessions:/app/training_sessions:rw
    environment:
      - METRICS_PORT=8081
      - METRICS_DIR=/app/training_sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - adai-network

  # Main chatbot API server
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: adai-chatbot:latest
    container_name: adai-chatbot-api
    ports:
      - "8080:8080"
    volumes:
      # Mount vocabulary directory (read-only)
      # Ensure vocab.txt exists in the local ./vocab directory
      - ./vocab:/app/vocab:ro
      
      # Mount model artifacts directory (read-only)
      # Place trained model weights here if available
      - ./models:/app/models:ro
      
      # Mount logs directory (read-write)
      # Application logs will be written here
      - ./logs:/app/logs:rw
      
      # Mount training sessions directory (read-write for metrics)
      - ./training_sessions:/app/training_sessions:rw
      
      # Optional: Mount custom configuration file
      # Uncomment to use file-based configuration instead of env vars
      # - ./config.conf:/etc/adai/config.conf:ro
    
    environment:
      # ============================================================
      # CONFIGURATION PRIORITY:
      # 1. Command-line arguments (if passed via command:)
      # 2. Environment variables (defined below)
      # 3. Configuration file (if mounted)
      # 4. Default values
      # ============================================================
      
      # ------------------------------------------------------------
      # Server Configuration
      # ------------------------------------------------------------
      
      # REQUIRED: Path to vocabulary file
      - VOCAB_PATH=/app/vocab/vocab.txt
      
      # OPTIONAL: Path to pretrained model weights
      # Leave commented to start with random initialization
      # - MODEL_PATH=/app/models/trained_model.bin
      
      # Server listening port (default: 8080)
      - PORT=8080
      
      # Session timeout in minutes (default: 30)
      - SESSION_TIMEOUT=30
      
      # Logging level: DEBUG, INFO, WARN, ERROR (default: INFO)
      # Use DEBUG for development, INFO for production
      - LOG_LEVEL=INFO
      
      # ------------------------------------------------------------
      # Model Architecture Parameters
      # ------------------------------------------------------------
      # Only change these if you're using a custom-trained model
      # with different architecture. Default values work well.
      
      - D_MODEL=512                  # Model embedding dimension
      - NUM_HEADS=8                  # Attention heads (must divide D_MODEL)
      - D_FF=2048                    # Feed-forward dimension
      - NUM_ENCODER_LAYERS=6         # Number of encoder layers
      - NUM_DECODER_LAYERS=6         # Number of decoder layers
      - MAX_SEQ_LENGTH=1024          # Maximum sequence length
      
      # ------------------------------------------------------------
      # Text Generation Parameters
      # ------------------------------------------------------------
      # Control response generation behavior
      
      - MAX_LENGTH=100               # Maximum tokens to generate
      - TEMPERATURE=1.0              # Sampling temperature (0.1-2.0)
      - TOP_P=0.9                    # Nucleus sampling threshold (0.0-1.0)
      - TOP_K=50                     # Top-k sampling candidates
      - BEAM_WIDTH=4                 # Beam search width
      
      # Generation strategy: greedy, beam, temperature, top_k, nucleus
      # - greedy: fastest, deterministic
      # - nucleus: balanced, recommended for chatbots
      # - beam: slower, more coherent for longer text
      - STRATEGY=nucleus

      # ------------------------------------------------------------
      # Metrics Daemon Integration
      # ------------------------------------------------------------
      # Push training metrics to the existing metrics-api-server daemon
      - ENABLE_METRICS_SERVICE=true
      - METRICS_PUSH_ENABLED=true
      - METRICS_SERVER_URL=http://metrics-api-server:8081
      - METRICS_PUSH_TIMEOUT_MS=1000
    
    # Run the server with environment variable configuration
    # The executable reads all config from env vars automatically
    command: ./chatbot_api_server
    depends_on:
      metrics-api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - adai-network
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: adai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - chatbot-api
    networks:
      - adai-network
    restart: unless-stopped
    profiles:
      - production

networks:
  adai-network:
    driver: bridge

volumes:
  # Named volumes for persistent data
  model-data:
  logs-data:
