# ai-machine's values over the repo's config.chatbot.conf (TD-575), shipped as etc/config.chatbot.conf and
# installed as /etc/adai/config.chatbot.conf for adai.service (scripts/ai_machine/adai.service).
MODEL_NAME=bodacious-badger
NAME_SERVICE_URL=http://192.168.1.16:8083
VOCAB_PATH=/opt/adai/vocab/bodacious-badger.vocab
MODEL_PATH=/opt/adai/models/bodacious-badger.bin
SESSION_DIR=/opt/adai/chat_sessions
HIPPOCAMPAL_STATE_PATH=/opt/adai/models/bodacious-badger.hippocampal
LOG_FILE_PATH=/var/log/adai/chatbot.log
PORT=8080
GPU_STRATEGY=normal
# Fallbacks only: MNS's record is authoritative.
D_MODEL=768
NUM_HEADS=12
D_FF=3072
NUM_ENCODER_LAYERS=8
NUM_DECODER_LAYERS=24
MAX_SEQ_LENGTH=1024
