# ai-machine's values over the repo's config.trainer.conf (TD-575). package-sycl.sh replaces each key's
# line in a copy of config.trainer.conf (or appends it) and ships the result as etc/config.trainer.conf;
# deploy.sh installs that as /etc/adai/config.trainer.conf. Both trainer_service instances
# (adai-trainer@lejepa, adai-trainer@chatbot) read it.
MODEL_NAME=bodacious-badger
NAME_SERVICE_URL=http://192.168.1.16:8083
REGISTRY_SERVER_URL=http://192.168.1.16:8082
METRICS_SERVER_URL=http://192.168.1.16:8081
RUN_GROUP=bb01
SESSION_DIR=/opt/adai/training_sessions/bodacious-badger
VOCAB_PATH=/opt/adai/vocab/bodacious-badger.vocab
MODEL_PATH=/opt/adai/models/bodacious-badger.bin
LOG_FILE_PATH=/var/log/adai/trainer.log
DOWNLOAD_DIR=/opt/adai/downloads
TOKENIZED_CACHE_DIR=/opt/adai/tokenized_cache
TRAINER_ADMIN_DIR=/opt/adai/trainer_admin
GPU_STRATEGY=normal
# Fallbacks only: MNS's record for bodacious-badger (and world-model-v1, linked) is authoritative.
D_MODEL=768
NUM_HEADS=12
D_FF=3072
NUM_ENCODER_LAYERS=8
NUM_DECODER_LAYERS=24
MAX_SEQ_LENGTH=1024
WORLD_MODEL_INJECT_EVERY_N_LAYERS=8
